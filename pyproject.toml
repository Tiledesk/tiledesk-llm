[dependency-groups]
dev = [
    "pytest>=8.2.2,<9.0.0",
    "fakeredis>=2.32.1,<3.0.0",
    "pytest-mock>=3.15.1,<4.0.0",
    "pytest-asyncio>=0.23.7,<0.24.0",
]

[build-system]
requires = ["poetry-core>=2.3.2"]
build-backend = "poetry.core.masonry.api"
