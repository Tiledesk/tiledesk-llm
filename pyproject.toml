    "FlagEmbedding>=1.3.5,<2.0.0",
    "pinecone-text>=0.11.0,<0.12.0",
    "sentence-transformers>=4.1.0,<5.0.0",
    "neo4j>=5.26.0,<6.0.0",
    "minio>=7.2.0,<8.0.0",
    "PyMuPdf>=1.27.2,<2.0.0",
    "pdf2image>=1.17.0,<2.0.0",
    "langchain-aws>=1.4.3,<2.0.0",
    "duckdb>=1.4.3,<2.0.0",
    "parquet>=1.3.1,<2.0.0",
    "igraph>=1.0.0,<2.0.0",
    "networkx>=3.6.1,<4.0.0",
    "pyarrow>=22.0.0,<23.0.0",
    "taskiq>=0.12.0,<0.13.0",
    "taskiq-redis>=1.2.1,<2.0.0",
    "docling>=2.85.0,<3.0.0",
    "pillow>=12.0.0,<13.0.0",
    "mineru>=2.0.0",
    "falkordb>=1.0.0,<2.0.0",
