[project]
name = "tilellm"
version = "0.12.4-rc1"
description = "tiledesk for RAG"
authors = [{ name = "Gianluca Lorenzo", email = "gianluca.lorenzo@gmail.com" }]
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.123.4,<0.124.0",
    "fastapi-cprofile>=0.0.2,<0.0.3",
    "jsonschema>=4.25.1,<5.0.0",
    "redis>=7.1.0,<8.0.0",
    "prometheus-client>=0.21.0,<0.22.0",
    "langchain>=1.2.15,<2.0.0",
    "langchain-core>=1.2.27,<2.0.0",
    "jq>=1.10.0,<2.0.0",
    "langchain-openai>=1.1.12,<2.0.0",
    "langchain-voyageai>=0.3.3,<0.4.0",
    "langchain-anthropic>=1.4.0,<2.0.0",
    "langchain-cohere>=0.5.0,<0.6.0",
    "langchain-google-genai>=4.2.1,<5.0.0",
    "langchain-groq>=1.1.2,<2.0.0",
    "langchain-deepseek>=1.0.1,<2.0.0",
    "pinecone-plugin-interface>=0.0.7,<0.0.8",
    "python-dotenv>=1.2.2,<2.0.0",
    "langchain-community>=0.4.1,<0.5.0",
    "langchain-experimental>=0.4.1,<0.5.0",
    "langchain-pinecone>=0.2.13,<0.3.0",
    "langchain-huggingface>=1.2.1,<2.0.0",
    "langchain-ollama>=1.1.0,<2.0.0",
    "langchain_xai>=1.2.2,<2.0.0",
    "langchain-mistralai>=1.1.2,<2.0.0",
    "langchain-qdrant>=1.1.0,<2.0.0",
    "langchain-milvus>=0.3.3,<0.4.0",
    "langchain-mcp-adapters>=0.2.2,<0.3.0",
    # langchain-mcp-adapters 0.2.2 only floors this (">=1.9.2") — pinned exact,
    # not a range, because "uv pip install ." (Dockerfile build, ignores the
    # lockfile) resolves straight from this file and drifts onto whatever's
    # newest at build time otherwise — broke prod 2026-08-05: a later mcp
    # release moved/removed mcp.shared.context.RequestContext, ImportError on
    # boot. Verified against 1.30.0 in this upgrade pass (2026-09-15); bump
    # this pin deliberately, never let it float.
    "mcp==1.30.0",
    "langgraph>=1.1.6,<2.0.0",
    "openai>=2.31.0,<3.0.0",
    "cohere>=5.21.1,<6.0.0",
    "pinecone>=7.3.0,<8.0.0",
    "qdrant-client>=1.17.1,<2.0.0",
    "pymilvus>=2.6.11,<3.0.0",
    "tiktoken>=0.12.0,<0.13.0",
    "beautifulsoup4>=4.14.3,<5.0.0",
    "unstructured[md]>=0.22.18,<0.23.0",
    "markdown>=3.10.2,<4.0.0",
    "playwright>=1.58.0,<2.0.0",
    "playwright-stealth>=2.0.3,<3.0.0",
    "pypdf>=6.9.2,<7.0.0",
    "trafilatura>=2.0",
    "docx2txt>=0.9,<0.10.0",
    "openpyxl>=3.1.5,<4.0.0",
    "xlrd>=2.0.2,<3.0.0",
    "wikipedia>=1.4.0,<2.0.0",
    "html2text>=2025.4.15,<2026.0.0",
    "psutil>=7.2.2,<8.0.0",
    "httpx>=0.28.1,<0.29.0",
    "gql>=4.0.0,<5.0.0",
    "PyJWT>=2.12.1,<3.0.0",
    "simsimd>=6.5.16,<7.0.0",
    "pandas>=3.0.2,<4.0.0",
    "PyMuPdf>=1.27.2,<2.0.0",
    "pdf2image>=1.17.0,<2.0.0",
    "python-docx>=1.2.0,<2.0.0",
    "reportlab>=4.2.0,<5.0.0",
    "uvicorn[standard]>=0.38.0,<0.39.0",
]

[project.urls]
repository = "https://github.com/Tiledesk/tiledesk-llm"

[project.scripts]
tilellm = "tilellm.__main__:main"

[project.optional-dependencies]
ml = [
    "torch>=2.9.1,<3.0.0",
    "FlagEmbedding>=1.3.5,<2.0.0",
